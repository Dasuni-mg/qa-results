<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finexa QA Results</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky top bar, module sidebar (becomes a scrolling strip on phones), one page per module. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#13202b; --muted:#5a6a79; --line:#dde3e9; --soft:#eaeff3;
  --accent:#0b5ea8; --accent-soft:#e3eefa;
  --pass:#1b7a4b; --pass-soft:#e0f3e8; --fail:#c0302a; --fail-soft:#fbe7e5; --warn:#a86300; --warn-soft:#fbefd9;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1318; --panel:#141c24; --ink:#e4ebf1; --muted:#90a2b3; --line:#25323e; --soft:#1b2630;
  --accent:#5ea9ea; --accent-soft:#172b40;
  --pass:#4cc38a; --pass-soft:#12301f; --fail:#ff7068; --fail-soft:#3a1a19; --warn:#e5a443; --warn-soft:#37290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1318; --panel:#141c24; --ink:#e4ebf1; --muted:#90a2b3; --line:#25323e; --soft:#1b2630;
  --accent:#5ea9ea; --accent-soft:#172b40;
  --pass:#4cc38a; --pass-soft:#12301f; --fail:#ff7068; --fail-soft:#3a1a19; --warn:#e5a443; --warn-soft:#37290f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-size:15px;letter-spacing:.01em;margin-right:auto}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn[hidden]{display:none}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1320px;margin:20px auto 0}
.side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 90px);overflow:auto}
.side h3{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
.nav{display:block;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:6px;border:1px solid transparent}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--accent-soft);border-color:var(--accent);}
.nav .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nav .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.nav .cnt.f{color:var(--fail);font-weight:500}
.mini{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--soft);margin-top:5px}
.mini i{display:block;height:100%}
.mini .p{background:var(--pass)}.mini .x{background:var(--fail)}
main{min-width:0}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;max-height:none;gap:6px;padding-bottom:6px}
  .side h3{display:none}
  .nav{flex:0 0 auto;min-width:130px;border-color:var(--line);background:var(--panel)}
}

/* generic blocks */
.page-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:26px;font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.tile .v.f{color:var(--fail)}.tile .v.p{color:var(--pass)}
.tile .n{font-size:12px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 18px;margin:0}
.meta div{min-width:0}
.meta dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:1px 0 0;overflow-wrap:anywhere}
.section{margin-top:18px}
.section>h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--soft)}
.bar2{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);min-width:90px}
.bar2 i{display:block}.bar2 .p{background:var(--pass)}.bar2 .x{background:var(--fail)}
.pill{display:inline-block;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill.pass{background:var(--pass-soft);color:var(--pass)}
.pill.fail{background:var(--fail-soft);color:var(--fail)}
.pill.new{background:var(--warn-soft);color:var(--warn)}
.pill.fixed{background:var(--accent-soft);color:var(--accent)}
.pill.still{background:var(--soft);color:var(--muted)}
.pill.sut{background:var(--fail-soft);color:var(--fail)}
.pill.taf{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--ink);margin:2px 4px 2px 0}
.pri{font-size:12px;color:var(--muted)}.pri.high{color:var(--ink);font-weight:600}

/* module page */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit}
.pat{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pat:last-child{border-bottom:0}
.pat .c{font-family:var(--mono);font-size:18px;color:var(--fail);font-weight:500}
.pat .m{overflow-wrap:anywhere}
.pat .w{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
td.t{min-width:260px;max-width:520px}
td.t .ttl{overflow-wrap:anywhere}
td.t .grp{font-size:12px;color:var(--muted)}
td.e{min-width:220px;max-width:420px;font-size:12.5px;color:var(--fail);overflow-wrap:anywhere}
.exp{border:0;background:transparent;color:var(--accent);padding:0;font-size:12.5px;margin-top:4px;display:block}
.detail td{background:var(--soft);padding:12px 16px}
.err{margin-bottom:12px}
.err:last-child{margin-bottom:0}
.err b{display:block;overflow-wrap:anywhere}
.err .loc{font-family:var(--mono);font-size:12px;color:var(--muted);margin:2px 0 6px;overflow-wrap:anywhere}
pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;max-height:260px;white-space:pre}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.drop{display:none;position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--accent) 16%,transparent);border:3px dashed var(--accent);align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--accent);pointer-events:none}
.drop.on{display:flex}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;max-width:90vw;font-size:13px}
.hero-up{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.matrix td,.matrix th{padding:7px 10px;text-align:right}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix td.z{color:var(--muted)}
.matrix td.f{color:var(--fail);font-weight:500}
@media (prefers-reduced-motion:no-preference){.nav{transition:background .12s}}
/* ---- UI polish ---- */
body{font-size:14.5px}
.panel{box-shadow:0 1px 2px rgba(19,32,43,.05)}
.tile{border-left:3px solid var(--line)}
.tile:nth-child(2){border-left-color:var(--pass)}.tile:nth-child(3){border-left-color:var(--fail)}
.tile:nth-child(4){border-left-color:var(--fail)}.tile:nth-child(5){border-left-color:var(--warn)}
.tile .v{font-size:28px}
thead th{position:sticky;top:0;z-index:1;background:var(--soft)}
tbody tr:hover>td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.detail:hover>td{background:var(--soft)}
td{padding:11px 12px}
.pill{padding:2px 9px;font-weight:600;letter-spacing:.01em}
.pill.sut::before,.pill.taf::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px}
td.e{color:var(--ink)}
td.e .exp{margin-top:6px;font-weight:500}
.seg button{padding:7px 13px}
.seg button:hover:not(.on){background:var(--soft)}
.seg button[data-f=SUT].on{background:var(--fail)}.seg button[data-f=TAF].on{background:var(--warn)}
.seg button[data-f=SUT]:not(.on){color:var(--fail)}.seg button[data-f=TAF]:not(.on){color:var(--warn)}
.search{padding:8px 12px}.search:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.pat .m .pill{margin-right:8px;vertical-align:1px}
.page-head h2{font-size:24px}
.section>h3{margin-top:4px}
</style></head><body>

<div class="bar">
  <h1 class="brand">Finexa QA Results<small id="runchip">Playwright pipeline</small></h1>
  <button class="btn primary" id="upbtn" type="button">Upload pipeline log</button>
  <input id="file" type="file" accept=".txt,.log,text/plain" hidden>
</div>
<div class="shell">
  <nav class="side" id="side" aria-label="Pages"></nav>
  <main id="main"></main>
</div>
<div class="drop" id="drop">Drop the pipeline log to load it</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function (root) {
  var MODULE_BY_FILE = {
    'cash-block': 'Cash Block', 'cash-deposit': 'Cash Deposit', 'cash-transfer': 'Cash Transfer',
    'cash-withdrawal': 'Cash Withdrawal', 'charges-refund': 'Charges & Refund',
    'share-deposit': 'Share Deposit', 'share-pledge': 'Share Pledge (In)', 'share-plegde-out': 'Share Pledge (Out)',
    'share-transfer': 'Share Transfer', 'share-withdraw': 'Share Withdrawal'
  };
  function slug(s) { return s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function prettify(base) { return base.replace(/[-_.]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  function moduleFromFile(file) {
    var base = file.split('/').pop().replace(/\.(scenarios|spec)\.ts$/, '').replace(/\.ts$/, '');
    var name = MODULE_BY_FILE[base] || prettify(base);
    return { name: name, slug: slug(name) };
  }
  var ID_RE = /[A-Z][A-Z0-9_]*(?:-[A-Z0-9_]+)*-[A-Z]?\d+[A-Z]?(?:-(?:USD|SAR|KWD))?/;
  function normMsg(m) {
    return m.replace(/"[^"]*"/g, '"…"').replace(/\d+(?:[.,]\d+)*/g, '#').replace(/\s+/g, ' ').trim().slice(0, 90);
  }
  function parse(text) {
    var lines = text.split(/\r?\n/);
    var tests = [], byRest = {}, order = 0;
    var meta = { build: null, date: null, finished: null, duration: null, workers: null, testPath: null,
      commit: null, commitMsg: null, branch: null, runner: null, reportUrl: null, reported: {} };
    var i, m;
    // ---- metadata + test start lines
    for (i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if ((m = ln.match(/^\[(\d+)\/(\d+)\] \[(\w+)\] › (.+)$/))) {
        var rest = m[4].trim();
        var parts = rest.split(' › ');
        var loc = parts[0], mm = loc.match(/^(.*?):(\d+):(\d+)$/);
        var file = mm ? mm[1] : loc;
        var title = parts[parts.length - 1];
        var describes = parts.slice(1, -1);
        var proj = 'default';
        var pm = (describes[0] || '').match(/\[(\w+)\]\s*$/);
        if (pm) proj = pm[1];
        var suite = (describes[0] || '').replace(/\s*\[\w+\]\s*$/, '');
        var tag = (title.match(/@(\w+)\s*$/) || [])[1] || '';
        var idm = title.match(ID_RE);
        if (!idm) for (var d = describes.length - 1; d >= 0 && !idm; d--) idm = describes[d].match(ID_RE);
        var mod = moduleFromFile(file);
        var t = {
          n: +m[1], key: rest, file: file, line: mm ? +mm[2] : 0, project: proj, suite: suite,
          module: mod.name, moduleSlug: mod.slug, id: idm ? idm[0] : ('#' + m[1]),
          title: title.replace(/\s*@\w+\s*$/, '').replace(/^[A-Z][A-Z0-9_\-]*\d+[A-Z]?(?:-[A-Za-z]+)?:\s*/, ''),
          fullTitle: title.replace(/\s*@\w+\s*$/, ''),
          group: describes.slice(1).join(' › '),
          priority: tag, status: 'pass', errors: [], step: '', trace: ''
        };
        tests.push(t); byRest[rest] = t;
        continue;
      }
      if (!meta.workers && (m = ln.match(/^Workers:\s+(\d+)/))) meta.workers = +m[1];
      if (!meta.testPath && (m = ln.match(/^Test path:\s+(.+)$/))) meta.testPath = m[1].trim();
      if (!meta.runner && (m = ln.match(/^Runner name:\s+(.+)$/))) meta.runner = m[1].trim();
      if (!meta.commit && (m = ln.match(/^HEAD is now at (\w+) (.*)$/))) { meta.commit = m[1]; meta.commitMsg = m[2]; }
      if (!meta.branch && (m = ln.match(/--branch='([^']+)'/))) meta.branch = m[1];
      if (!meta.build && (m = ln.match(/Build: \S+ \(#(\d+)\)/))) meta.build = m[1];
      if (!meta.date && (m = ln.match(/\[INFO\]\s+(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})/))) { meta.date = m[1]; meta.finished = m[2]; }
      if (!meta.reportUrl && (m = ln.match(/^Report published:\s+(\S+)/))) meta.reportUrl = m[1];
      if ((m = ln.match(/^\s+(\d+) (failed|skipped|passed|flaky|did not run)(?: \((.+)\))?\s*$/))) {
        meta.reported[m[2]] = +m[1]; if (m[3]) meta.duration = m[3];
      }
    }
    // ---- failure blocks
    var hdr = /^ {2}(\d+)\) \[(\w+)\] › (.+?)\s*$/;
    for (i = 0; i < lines.length; i++) {
      if (!(m = lines[i].match(hdr))) continue;
      var rest2 = m[3], step = '', t2 = byRest[rest2];
      if (!t2) {
        var keys = Object.keys(byRest), best = null;
        for (var k = 0; k < keys.length; k++) {
          if (rest2.indexOf(keys[k]) === 0 && /^\s+› /.test(rest2.slice(keys[k].length)) && (!best || keys[k].length > best.length)) best = keys[k];
        }
        if (best) { t2 = byRest[best]; step = rest2.slice(best.length).replace(/^\s+› /, ''); }
      }
      if (!t2) {
        var p2 = rest2.split(' › '), mm2 = p2[0].match(/^(.*?):(\d+):(\d+)$/), f2 = mm2 ? mm2[1] : p2[0];
        var mod2 = moduleFromFile(f2), ti = p2[p2.length - 1];
        t2 = { n: 9000 + (++order), key: rest2, file: f2, line: mm2 ? +mm2[2] : 0, project: 'default', suite: '', module: mod2.name,
          moduleSlug: mod2.slug, id: (ti.match(ID_RE) || ['?'])[0], title: ti, fullTitle: ti, group: '', priority: '', status: 'pass', errors: [], step: '', trace: '' };
        tests.push(t2);
      }
      t2.status = 'fail'; t2.step = step;
      // body
      var j = i + 1, body = [];
      for (; j < lines.length; j++) {
        var bl = lines[j];
        if (bl.length && !/^\s/.test(bl)) break;
        if (hdr.test(bl) || /^ {2}\d+ (failed|skipped|passed)/.test(bl)) break;
        body.push(bl);
      }
      i = j - 1;
      var errs = [], cur = null;
      for (var b = 0; b < body.length; b++) {
        var bm = body[b].match(/^ {4}((?:\w*Error)): (.*)$/);
        if (bm) { cur = { type: bm[1], message: bm[2].trim(), detail: [], frame: '' }; errs.push(cur); continue; }
        if (/^ {4}attachment #/.test(body[b]) ) { cur = null; continue; }
        var tm = body[b].match(/^\s+(test-results\/\S+trace\.zip)\s*$/);
        if (tm && !t2.trace) t2.trace = tm[1];
        if (cur) {
          var fm = body[b].match(/^\s+at (tests\/\S+?):(\d+)\s*$/);
          if (fm && !cur.frame) cur.frame = fm[1] + ':' + fm[2];
          if (cur.detail.length < 40) cur.detail.push(body[b].replace(/^ {4}/, ''));
        }
      }
      errs.forEach(function (e) {
        var dt = e.detail.join('\n').replace(/\n{3,}/g, '\n\n').trim();
        e.detail = dt.slice(0, 1800);
        // message may continue on following lines, keep first line only (already)
      });
      t2.errors = errs;
      if (errs[0]) {
        var fr = errs[0].frame || '';
        t2.pattern = normMsg(errs[0].message) + (fr ? '  ·  ' + fr.replace(/^tests\//, '').replace(/:\d+$/, '') : '');
      } else t2.pattern = 'Unknown failure';
    }
    tests.sort(function (a, b) { return a.n - b.n; });
    if (!meta.date) { meta.date = new Date().toISOString().slice(0, 10); }
    var total = tests.length, failed = tests.filter(function (t) { return t.status === 'fail'; }).length;
    meta.total = total; meta.failed = failed;
    return { meta: meta, tests: tests };
  }
  var api = { parse: parse, slug: slug };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.LogParser = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

function copy(txt){
  var done=function(){toast('Copied')};
  try{navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt)})}catch(e){fallbackCopy(txt)}
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text and copy it')}ta.remove()}


/* ---------- compare ---------- */
function cmpData(){
  var cur=runId(run),others=loadIndex().filter(function(x){return x.id!==cur});
  var bid=ui.baseId;
  if(!bid||!others.some(function(x){return x.id===bid})){
    var ear=others.filter(function(x){return x.date<run.meta.date||(x.date===run.meta.date&&(+x.build||0)<(+run.meta.build||0))});
    var pick=(ear.length?ear:others).slice(-1)[0];bid=pick?pick.id:null;
  }
  var d={others:others,bid:bid,base:bid?loadRun(bid):null,both:[],fixed:[],newf:[],gone:[]};
  if(!d.base)return d;
  var bm={},cm={};
  d.base.tests.forEach(function(t){bm[t.project+'|'+t.id]=t});
  run.tests.forEach(function(t){cm[t.project+'|'+t.id]=t});
  run.tests.forEach(function(t){var b=bm[t.project+'|'+t.id];
    if(t.status==='fail'){if(b&&b.status==='fail')d.both.push({cur:t,base:b});else d.newf.push({cur:t,base:b||null})}
    else if(b&&b.status==='fail')d.fixed.push({cur:t,base:b})});
  d.base.tests.forEach(function(b){if(b.status==='fail'&&!cm[b.project+'|'+b.id])d.gone.push({cur:null,base:b})});
  return d;
}
function errOf(t){return t&&t.errors&&t.errors[0]?t.errors[0].message:''}
/* Issue owner: balance / narration mismatches are product bugs (SUT); everything else (time outs, locators, data setup) is automation (TAF). */
function issueOf(t){
  if(!t||t.status!=='fail')return '';
  var e=(t.errors&&t.errors[0])||{},msg=e.message||'',det=e.detail||'';
  if(e.type==='TimeoutError'||/^locator\.|^page\.|^frame\./i.test(msg))return 'TAF';
  if(/waiting for (getBy|locator)/i.test(det)&&!/Expected:|Received:/.test(det))return 'TAF';
  return /balance|narration/i.test(msg+' '+det.replace(/\n\s*\d*\s*[|>]\s.*$/gm,''))?'SUT':'TAF';
}
function issuePill(t){var k=issueOf(t);return k?'<span class="pill '+k.toLowerCase()+'" title="'+(k==='SUT'?'System under test issue':'Test automation framework issue')+'">'+k+' Issue → '+(k==='SUT'?'Developers':'QA')+'</span> ':''}
function viewCompare(){
  var d=cmpData();
  var h='<div class="page-head"><div><h2>Compare runs</h2><div class="sub">Today\'s run against an earlier run, matched by test ID and project.</div></div></div>';
  if(!d.base){
    $('main').innerHTML=h+'<div class="panel empty">There is no earlier run saved in this browser yet.<br>Upload yesterday\'s pipeline log first, then today\'s. This page then shows what failed on both days, what only failed yesterday, and what only fails today.</div>';return}
  var bl=fmtDate(d.base.meta.date)+(d.base.meta.build?' (#'+d.base.meta.build+')':''),cl=fmtDate(run.meta.date)+(run.meta.build?' (#'+run.meta.build+')':'');
  h+='<div class="tools"><label class="sub" for="basesel">Compare '+esc(cl)+' with</label><select id="basesel" class="search" style="flex:0 1 260px">'+
    d.others.slice().reverse().map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===d.bid?' selected':'')+'>'+fmtDate(x.date)+(x.build?' · #'+esc(x.build):'')+' · '+x.failed+' failed</option>'}).join('')+'</select>'+
    '<button class="btn dlb" data-act="csv-cmp" type="button">Download CSV</button><button class="btn dlb" data-act="xlsx-cmp" type="button">Download Excel</button></div>';
  h+='<div class="tiles">'+
    '<div class="tile"><div class="l">Failed both days</div><div class="v f">'+d.both.length+'</div><div class="n">still broken</div></div>'+
    '<div class="tile"><div class="l">Failed before, pass now</div><div class="v p">'+d.fixed.length+'</div><div class="n">fixed</div></div>'+
    '<div class="tile"><div class="l">Fail now only</div><div class="v f">'+d.newf.length+'</div><div class="n">new failures</div></div>'+
    (d.gone.length?'<div class="tile"><div class="l">Not in this run</div><div class="v">'+d.gone.length+'</div><div class="n">failed before, not run now</div></div>':'')+'</div>';
  // per module summary
  var mm={};
  function add(a,k){a.forEach(function(e){var n=(e.cur||e.base).module;(mm[n]||(mm[n]={both:0,fixed:0,newf:0,gone:0}))[k]++})}
  add(d.both,'both');add(d.fixed,'fixed');add(d.newf,'newf');add(d.gone,'gone');
  var names=Object.keys(mm).sort();
  h+='<div class="section" style="margin-top:0"><h3>By module</h3><div class="panel wrap"><table class="matrix"><thead><tr><th>Module</th><th>Failed both days</th><th>Fixed</th><th>New failures</th></tr></thead><tbody>'+
    (names.length?names.map(function(n){var x=mm[n];return '<tr><td>'+esc(n)+'</td><td class="'+(x.both?'f':'z')+' num">'+x.both+'</td><td class="num '+(x.fixed?'':'z')+'">'+x.fixed+'</td><td class="'+(x.newf?'f':'z')+' num">'+x.newf+'</td></tr>'}).join(''):'<tr><td colspan="4"><div class="empty">No failures in either run.</div></td></tr>')+'</tbody></table></div></div>';
  function sect(title,sub,arr,mode){
    h+='<div class="section"><h3>'+esc(title)+' ('+arr.length+')</h3><div class="note" style="margin:-4px 0 8px">'+esc(sub)+'</div>';
    if(!arr.length){h+='<div class="panel empty">None</div></div>';return}
    var rows=arr.slice().sort(function(a,b){var x=(a.cur||a.base),y=(b.cur||b.base);return x.module<y.module?-1:x.module>y.module?1:(x.id<y.id?-1:1)});
    h+='<div class="panel wrap"><table><thead><tr><th>Module</th><th>ID</th><th>Project</th><th>Test</th><th>'+(mode==='fixed'?'Failure before':'Failure now')+'</th>'+(mode==='both'?'<th>Same error?</th>':'')+'</tr></thead><tbody>';
    rows.forEach(function(e){var t=e.cur||e.base,er=mode==='fixed'||mode==='gone'?errOf(e.base):errOf(e.cur);
      h+='<tr><td style="white-space:nowrap">'+esc(t.module)+'</td><td class="mono" style="white-space:nowrap">'+esc(t.id)+'</td><td>'+esc(t.project)+'</td><td class="t"><div class="ttl">'+esc(t.title)+'</div></td><td class="e">'+esc(er.slice(0,180))+(er.length>180?'…':'')+'</td>'+
        (mode==='both'?'<td>'+(e.cur.pattern===e.base.pattern?'<span class="pill still">Same</span>':'<span class="pill new">Different</span>')+'</td>':'')+'</tr>'});
    h+='</tbody></table></div></div>';
  }
  sect('Failed '+bl+' and failed again now','Still broken. Check the "Same error?" column to see if the cause changed.',d.both,'both');
  sect('Failed '+bl+', passing now','These were fixed since the earlier run.',d.fixed,'fixed');
  sect('Passing before, failing now','New failures since '+bl+'. Tests that did not exist in that run also appear here.',d.newf,'newf');
  if(d.gone.length)sect('Failed before, not in this run','These tests failed earlier but were not started in the current log.',d.gone,'gone');
  $('main').innerHTML=h;markDl();
  $('basesel').onchange=function(){ui.baseId=this.value;viewCompare()};
}
var CMPF=['Category','Module','Project','Test ID','Title','Failure now','Failure before','Same error'];
function cmpRows(d){
  var out=[];
  [['Failed both days',d.both],['Fixed (failed before, passing now)',d.fixed],['New failure (fails now only)',d.newf],['Failed before, not run now',d.gone]].forEach(function(c){
    c[1].forEach(function(e){var t=e.cur||e.base;out.push([c[0],t.module,t.project,t.id,t.title,errOf(e.cur),errOf(e.base),c[0]==='Failed both days'?(e.cur.pattern===e.base.pattern?'Yes':'No'):''])})});
  return out;
}

/* ---------- saved runs ---------- */
function viewRuns(){
  var idx=loadIndex().slice().reverse();
  var h='<div class="page-head"><div><h2>Saved runs</h2><div class="sub">Each uploaded log is kept in this browser (last '+KEEP+' runs). Upload a new log each day to build the history.</div></div></div>';
  var recs=idx.map(function(x){return {x:x,r:loadRun(x.id)}}).filter(function(o){return o.r});
  if(!recs.length){$('main').innerHTML=h+'<div class="panel empty">No saved runs yet. Upload a pipeline log to start.</div>';return}
  h+='<div class="panel wrap"><table><thead><tr><th>Date</th><th>Build</th><th class="r">Tests</th><th class="r">Passed</th><th class="r">Failed</th><th class="r">Pass rate</th><th></th></tr></thead><tbody>';
  recs.forEach(function(o){
    var t=o.r.tests.length,f=o.r.tests.filter(function(z){return z.status==='fail'}).length;
    var cur=o.x.id===runId(run);
    h+='<tr><td>'+fmtDate(o.x.date)+(cur?' <span class="pill fixed">Viewing</span>':'')+'</td><td class="mono">#'+esc(o.x.build||'?')+'</td><td class="r num">'+t+'</td><td class="r num">'+(t-f)+'</td><td class="r num" style="color:var(--fail)">'+f+'</td><td class="r num">'+pct(t-f,t)+'%</td>'+
      '<td style="white-space:nowrap;text-align:right"><button class="btn" data-open="'+esc(o.x.id)+'" type="button">Open</button> <button class="btn" data-del="'+esc(o.x.id)+'" type="button">Delete</button></td></tr>';
  });
  h+='</tbody></table></div>';
  // failures per module matrix
  var mset={};recs.forEach(function(o){o.r.tests.forEach(function(t){mset[t.module]=1})});
  var mn=Object.keys(mset).sort(), cols=recs.slice(0,10).reverse();
  if(cols.length>1){
    h+='<div class="section"><h3>Failures per module, by run</h3><div class="panel wrap"><table class="matrix"><thead><tr><th>Module</th>'+cols.map(function(o){return '<th>'+fmtDate(o.x.date).replace(/ 20\d\d$/,'')+' #'+esc(o.x.build||'?')+'</th>'}).join('')+'</tr></thead><tbody>';
    mn.forEach(function(n){
      h+='<tr><td>'+esc(n)+'</td>'+cols.map(function(o){var c=o.r.tests.filter(function(t){return t.module===n&&t.status==='fail'}).length;return '<td class="'+(c?'f':'z')+' num">'+c+'</td>'}).join('')+'</tr>';
    });
    h+='</tbody></table></div></div>';
  }
  $('main').innerHTML=h;
  $('main').onclick=function(ev){
    var b=ev.target.closest('button');if(!b)return;
    if(b.dataset.open){var r=loadRun(b.dataset.open);if(r){setCurrent(r);location.hash='#overview';route()}}
    if(b.dataset.del){
      if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirm delete';return}
      var id=b.dataset.del;lsDel('qa.run.'+id);lsSet('qa.index',JSON.stringify(loadIndex().filter(function(x){return x.id!==id})));
      if(id===runId(run)){var ix=loadIndex();var last=ix.length?loadRun(ix[ix.length-1].id):null;setCurrent(last||SEED)}
      else setCurrent(run);
      route();
    }
  };
}

/* ---------- downloads ---------- */
var FIELDS=['Run date','Build','Module','Project','Test ID','Title','Priority','Result','Issue type','Route to','Step','First error','Failure pattern','Spec file','Trace'];
function row(t){
  var e=(t.errors&&t.errors[0])||null;
  return [run.meta.date,run.meta.build||'',t.module,t.project,t.id,t.title,t.priority,t.status==='fail'?'Failed':'Passed',issueOf(t),({SUT:'Developers',TAF:'QA'})[issueOf(t)]||'',t.step||'',e?e.message:'',t.pattern||'',t.file.replace(/^src\/tests\/specs\//,'')+':'+t.line,t.trace||''];
}
function csvOf(tests){
  var q=function(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '﻿'+[FIELDS].concat(tests.map(row)).map(function(r){return r.map(q).join(',')}).join('\r\n')+'\r\n';
}
function base(){return run.meta.date+(run.meta.build?'-build-'+run.meta.build:'')}
function save(name,data){
  if(!dl){toast('Downloads are not available in this view');return}
  dl.save({filename:name,data:data}).then(function(){toast('Saved '+name)},function(e){
    if(e&&e.code==='declined')return;toast('Could not save: '+(e&&e.message?e.message:'unknown error'))});
}
function sheetOf(tests){
  var ws=XLSX.utils.aoa_to_sheet([FIELDS].concat(tests.map(row)));
  ws['!cols']=[{wch:11},{wch:7},{wch:18},{wch:10},{wch:14},{wch:60},{wch:9},{wch:8},{wch:11},{wch:11},{wch:30},{wch:60},{wch:50},{wch:42},{wch:40}];
  ws['!freeze']={xSplit:0,ySplit:1};return ws;
}
function sname(n,used){var s=n.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31);var b=s,i=2;while(used[s])s=b.slice(0,28)+' '+(i++);used[s]=1;return s}
function xlsxFor(mods){
  if(typeof XLSX==='undefined'){toast('Excel export library failed to load');return null}
  var wb=XLSX.utils.book_new(),used={};
  var sum=[['Module','Tests','Passed','Failed','Pass rate %','New failures','Fixed']].concat(mods.map(function(m){var t=m.pass+m.fail;return [m.name,t,m.pass,m.fail,pct(m.pass,t),prev?m.nw:'',prev?m.fx:'']}));
  var T=mods.reduce(function(a,m){return a+m.pass+m.fail},0),F=mods.reduce(function(a,m){return a+m.fail},0);
  sum.push(['All modules',T,T-F,F,pct(T-F,T),'','']);
  var ws=XLSX.utils.aoa_to_sheet(sum);ws['!cols']=[{wch:22},{wch:8},{wch:8},{wch:8},{wch:11},{wch:13},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws,sname('Summary',used));
  mods.forEach(function(m){XLSX.utils.book_append_sheet(wb,sheetOf(m.tests),sname(m.name,used))});
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b){var g=ev.target.closest('tr[data-go]');if(g&&!ev.target.closest('a')){location.hash='#'+g.dataset.go}return}
  var act=b.dataset.act,mods=modules(),m=mods.filter(function(x){return x.slug===b.dataset.slug})[0];
  if(act==='csv-mod'&&m)save(m.slug+'-'+base()+'.csv',csvOf(m.tests));
  else if(act==='xlsx-mod'&&m){var d=xlsxFor([m]);if(d)save(m.slug+'-'+base()+'.xlsx',d)}
  else if(act==='xlsx-all'){var d2=xlsxFor(mods);if(d2)save('qa-results-'+base()+'.xlsx',d2)}
  else if(act==='csv-cmp'||act==='xlsx-cmp'){
    var cd=cmpData();if(!cd.base)return;var rows=cmpRows(cd),nm='compare-'+cd.base.meta.date+'-vs-'+run.meta.date;
    if(act==='csv-cmp'){var q=function(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
      save(nm+'.csv','\ufeff'+[CMPF].concat(rows).map(function(r){return r.map(q).join(',')}).join('\r\n')+'\r\n')}
    else if(typeof XLSX==='undefined')toast('Excel export library failed to load');
    else{var wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([CMPF].concat(rows));ws['!cols']=[{wch:30},{wch:18},{wch:10},{wch:14},{wch:60},{wch:60},{wch:60},{wch:10}];
      XLSX.utils.book_append_sheet(wb,ws,'Comparison');save(nm+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
  }
  else if(act==='csv-fail')save('qa-failures-'+base()+'.csv',csvOf(run.tests.filter(function(t){return t.status==='fail'})));
});
function markDl(){[].forEach.call(document.querySelectorAll('.dlb'),function(b){b.hidden=!dl})}

/* ---------- upload ---------- */
function ingest(file){
  if(!file)return;
  file.text().then(function(txt){
    var r=P.parse(txt);
    if(!r.tests.length){toast('No Playwright tests found in that file. Upload the full pipeline log (.txt).');return}
    var ok=saveRun(r);setCurrent(r);ui={};
    location.hash='#overview';route();
    toast(ok?('Loaded '+r.tests.length+' tests · '+r.meta.failed+' failed. Saved to this browser.'):'Loaded, but this browser had no room to save it.');
  },function(){toast('Could not read that file')});
}
$('upbtn').onclick=function(){$('file').click()};
$('file').onchange=function(){ingest(this.files[0]);this.value=''};
var dc=0;
window.addEventListener('dragenter',function(e){if(e.dataTransfer&&[].indexOf.call(e.dataTransfer.types,'Files')>=0){dc++;$('drop').classList.add('on')}});
window.addEventListener('dragleave',function(){dc=Math.max(0,dc-1);if(!dc)$('drop').classList.remove('on')});
window.addEventListener('dragover',function(e){e.preventDefault()});
window.addEventListener('drop',function(e){e.preventDefault();dc=0;$('drop').classList.remove('on');if(e.dataTransfer.files&&e.dataTransfer.files[0])ingest(e.dataTransfer.files[0])});
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
var idx=loadIndex(),first=idx.length?loadRun(idx[idx.length-1].id):null;
if(!first){first=SEED;saveRun(SEED)}
setCurrent(first);route();
dl={save:function(o){return new Promise(function(res,rej){try{
  var blob=new Blob([o.data],{type:/\.xlsx$/.test(o.filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'text/csv;charset=utf-8'});
  var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},4000);res({status:'saved'})}catch(e){rej(e)}})}};markDl();
})();
</script>
